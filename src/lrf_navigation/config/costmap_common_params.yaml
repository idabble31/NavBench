footprint: [[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]] # Adjust based on the robot's footprint

obstacle_layer:
  enabled: true
  obstacle_range: 5.0
  raytrace_range: 6.0
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    min_obstacle_height: 0.0
    max_obstacle_height: 2.0

inflation_layer:
  enabled: true
  inflation_radius: 0.55
  cost_scaling_factor: 2.58